<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Türkiye in Sixty Seconds</title>
<meta name="description" content="A sixty-second animation, drawn entirely in code, through nearly twelve thousand years of history in Anatolia and Thrace.">
<!--
  Türkiye in Sixty Seconds
  Everything on screen is drawn with the Canvas 2D API, and the music is synthesised live with the Web Audio API:
  no images, audio files, fonts, libraries or network requests.
  The loop lasts exactly 60 seconds. Tap or click for sound (M toggles it), Space pauses, the arrow keys jump between chapters.

  Sources for the dates and facts used in the captions:
  Göbekli Tepe, 9600–8200 BCE ............ https://whc.unesco.org/en/list/1572/
  Çatalhöyük, 7400–6200 BCE, roof access .. https://whc.unesco.org/en/list/1405/
  Hattusa and the Kadesh peace treaty ..... https://www.un.org/ungifts/replica-peace-treaty-between-hattusilis-and-ramses-ii
  Troy, 4,000 years of history ............ https://whc.unesco.org/en/list/849/
  Lydian electrum coinage ................. https://www.worldhistory.org/article/1793/the-invention-of-the-first-coinage-in-ancient-lydi/
  Alexander at the Granicus, 334 BCE ...... https://www.britannica.com/event/Battle-of-the-Granicus-334
  Constantinople dedicated in 330 ......... https://www.britannica.com/biography/Constantine-I-Roman-emperor
  Hagia Sophia, 537 ....................... https://smarthistory.org/hagia-sophia-istanbul/
  Manzikert, 1071 ......................... https://www.britannica.com/event/Battle-of-Manzikert
  Osman I and 1299 ........................ https://www.britannica.com/biography/Osman-I
  Fall of Constantinople, 1453 ............ https://www.britannica.com/event/Fall-of-Constantinople-1453
  Süleymaniye Mosque, 1550–1557 ........... https://smarthistory.org/mimar-sinan-suleymaniye-mosque-istanbul/
  Gallipoli, 1915 ......................... https://www.iwm.org.uk/history/what-you-need-to-know-about-the-gallipoli-campaign
  Republic, 29 October 1923 ............... https://www.britannica.com/place/Ankara
  Alphabet reform, 1928 ................... https://www.cambridge.org/core/journals/international-journal-of-middle-east-studies/article/learning-to-read-again-the-social-experiences-of-turkeys-1928-alphabet-reform/F313C1942EB18220E9FD9B2B417D5601
  Women's suffrage, 1934 .................. https://eca.unwomen.org/en/news/stories/2016/12/turkeys-parliament-celebrates-womens-rights-to-vote-and-run-for-office
  Bosphorus Bridge, 1973 .................. https://www.msn.com/en-us/news/world/on-this-day-1973-the-bosphorus-bridge-united-europe-and-asia/vi-AA24daFc
  "Türkiye" at the United Nations, 2022 ... https://turkiye.un.org/en/184798-turkeys-name-changed-t%C3%BCrkiye
  Cappadocia ............................. https://whc.unesco.org/en/list/357/
  Anatolia, from anatolē "sunrise" ........ https://www.etymonline.com/word/Anatolia
  Flag geometry (Turkish Flag Law, 1936) .. https://www.crwflags.com/fotw/flags/tr.html
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b1c; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #safe {
    position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="stage" role="img" aria-label="A sixty-second animated history of Türkiye, from Göbekli Tepe to the Republic and modern Istanbul."></canvas>
<div id="safe"></div>
<p id="live" class="sr" aria-live="polite"></p>
<script>
(() => {
'use strict';

const cvs = document.getElementById('stage');
const mainCtx = cvs.getContext('2d');
let ctx = mainCtx;
const layer = document.createElement('canvas'), layerCtx = layer.getContext('2d');
const live = document.getElementById('live');
const safeEl = document.getElementById('safe');

const TAU = Math.PI * 2;
const SP = 1600;      // world distance between chapters (stage units)
const GY = 700;       // ground line
const MOVE = 1;       // seconds of camera travel between chapters (two beats of the music)
const TOTAL = 60;     // seconds per loop
const DRIFT = 44;     // slow camera drift while a chapter holds
const SERIF = '"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif';
const SANS = 'system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const reduce = matchMedia('(prefers-reduced-motion: reduce)');

/* ---------------------------------------------------------------- utilities */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const smooth = (a, b, v) => { const x = clamp((v - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const vnoise = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u); };
const fbm = x => { let v = 0, a = .5, f = 1; for (let k = 0; k < 4; k++) { v += a * vnoise(x * f + k * 31.7); f *= 2.03; a *= .5; } return v / .9375; };
const hex = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------------------------------------------------------- drawing helpers */
function P(a) { ctx.beginPath(); ctx.moveTo(a[0], a[1]); for (let k = 2; k < a.length; k += 2) ctx.lineTo(a[k], a[k + 1]); ctx.closePath(); }
function fillP(a, col) { P(a); ctx.fillStyle = col; ctx.fill(); }
function circ(x, y, r, col) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = col; ctx.fill(); }
function ell(x, y, rx, ry, col, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, TAU); ctx.fillStyle = col; ctx.fill(); }
function halfDome(x, base, rx, ry, col) { ctx.beginPath(); ctx.ellipse(x, base, rx, ry, 0, Math.PI, TAU); ctx.closePath(); ctx.fillStyle = col; ctx.fill(); }
function line(x1, y1, x2, y2, w, col) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineWidth = w; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.stroke(); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function glow(x, y, r, c, a, add) {
  if (r <= 0 || a <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgb(c, a)); g.addColorStop(1, rgb(c, 0));
  const op = ctx.globalCompositeOperation; if (add) ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.globalCompositeOperation = op;
}
function star8(x, y, r, col) {
  ctx.fillStyle = col;
  for (const a of [0, Math.PI / 4]) { ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.fillRect(-r * .7, -r * .7, r * 1.4, r * 1.4); ctx.restore(); }
}
function sparkle(x, y, r, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x, y - r); ctx.lineTo(x + r * .22, y - r * .22); ctx.lineTo(x + r, y); ctx.lineTo(x + r * .22, y + r * .22);
  ctx.lineTo(x, y + r); ctx.lineTo(x - r * .22, y + r * .22); ctx.lineTo(x - r, y); ctx.lineTo(x - r * .22, y - r * .22);
  ctx.closePath(); ctx.fill();
}
function wheel(x, y, r, a, col, n) {
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  ctx.lineWidth = 2; ctx.beginPath();
  for (let k = 0; k < n; k++) { const b = a + k * TAU / n; ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(b) * r, y + Math.sin(b) * r); }
  ctx.stroke(); circ(x, y, r * .18, col);
}

// A walking figure. y is the feet; arm angles are measured from hanging straight down, positive = forward.
function person(x, y, h, col, o = {}) {
  const walk = o.walk || 0, lean = o.lean || 0;
  ctx.save(); ctx.translate(x, y); if (o.flip) ctx.scale(-1, 1);
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const hip = -h * .47, sh = -h * .8, hr = h * .095, lx = lean * h * .22, L = h * .47, A = h * .36;
  ctx.lineWidth = Math.max(1.3, h * .085);
  const s1 = Math.sin(walk) * .45, s2 = -s1;
  ctx.beginPath();
  ctx.moveTo(0, hip); ctx.lineTo(Math.sin(s1) * L, hip + Math.cos(s1) * L);
  ctx.moveTo(0, hip); ctx.lineTo(Math.sin(s2) * L, hip + Math.cos(s2) * L);
  ctx.stroke();
  if (o.dress) P([-h * .17, hip + h * .22, h * .17, hip + h * .22, h * .08 + lx, sh, -h * .08 + lx, sh]);
  else P([-h * .075, hip + 2, h * .075, hip + 2, h * .09 + lx, sh, -h * .09 + lx, sh]);
  ctx.fill();
  ctx.beginPath(); ctx.arc(lx * 1.1, sh - hr * 1.2, hr, 0, TAU); ctx.fill();
  const a1 = o.arm != null ? o.arm : .2 + Math.sin(walk) * .4, a2 = o.arm2 != null ? o.arm2 : .2 - Math.sin(walk) * .4;
  ctx.beginPath();
  ctx.moveTo(lx, sh + 2); ctx.lineTo(lx + Math.sin(a1) * A, sh + 2 + Math.cos(a1) * A);
  ctx.moveTo(lx, sh + 2); ctx.lineTo(lx + Math.sin(a2) * A, sh + 2 + Math.cos(a2) * A);
  ctx.stroke();
  if (o.hat) o.hat(lx * 1.1, sh - hr * 1.2, hr);
  ctx.restore();
}

// A galloping horse facing +x. Design box: hooves at y=0, about 120 units long.
function legH(hx, hy, ph, dir) {
  const sw = Math.sin(ph) * .55, bend = Math.cos(ph) * .5 + .5, l1 = 25, l2 = 27;
  const kx = hx + Math.sin(sw) * l1, ky = hy + Math.cos(sw) * l1;
  const a2 = sw + (dir > 0 ? -bend : bend) * .9;
  ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(kx, ky); ctx.lineTo(kx + Math.sin(a2) * l2, ky + Math.cos(a2) * l2); ctx.stroke();
}
function horse(x, y, sc, ph, col, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc * (o.flip ? -1 : 1), sc);
  ctx.translate(0, Math.sin(ph * 2) * 2.2);
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = 6.5;
  legH(20, -54, ph, 1); legH(-22, -56, ph + 2.8, -1); legH(26, -54, ph + .7, 1); legH(-16, -56, ph + 3.5, -1);
  ctx.beginPath(); ctx.ellipse(0, -64, 33, 15, -.03, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(22, -65, 14, 15, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-24, -66, 14, 15, 0, 0, TAU); ctx.fill();
  P([18, -74, 34, -100, 46, -104, 42, -84, 34, -58]); ctx.fill();
  ctx.beginPath(); ctx.moveTo(36, -104); ctx.lineTo(44, -112); ctx.lineTo(66, -94); ctx.quadraticCurveTo(68, -86, 60, -86); ctx.lineTo(44, -90); ctx.closePath(); ctx.fill();
  P([40, -106, 41, -117, 46, -108]); ctx.fill();
  ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(40, -106); ctx.quadraticCurveTo(26, -96 + Math.sin(ph) * 2, 18, -78); ctx.stroke();
  ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-34, -70); ctx.quadraticCurveTo(-50, -68 + Math.sin(ph * 1.3) * 4, -58, -50 + Math.sin(ph) * 6); ctx.stroke();
  if (o.blaze) circ(52, -100, 2.2, o.blaze);
  if (o.rider) o.rider();
  ctx.restore();
}

function tufts(x0, x1, y, col, sc, t, seed) {
  ctx.strokeStyle = col; ctx.lineWidth = 2 * sc; ctx.lineCap = 'round'; ctx.beginPath();
  for (let k = 0; k < 60; k++) {
    const x = lerp(x0, x1, hash(k * 3.1 + seed)), yy = y + hash(k * 7.7 + seed) * 40;
    const hgt = (8 + hash(k * 1.3 + seed) * 14) * sc, sw = Math.sin(t * 1.5 + x * .02) * 2;
    for (let b = -1; b <= 1; b++) { ctx.moveTo(x + b * 3, yy); ctx.lineTo(x + b * 5 + sw, yy - hgt * (b === 0 ? 1 : .7)); }
  }
  ctx.stroke();
}
function birds(x, y, n, t, col, sc = 1) {
  ctx.strokeStyle = col; ctx.lineWidth = 2 * sc; ctx.lineCap = 'round'; ctx.beginPath();
  for (let k = 0; k < n; k++) {
    const bx = x + k * 26 * sc + (k % 2) * 8, by = y + (k % 3) * 12 * sc + Math.sin(t * 1.3 + k) * 4, f = Math.sin(t * 9 + k * 1.7) * 5 * sc;
    ctx.moveTo(bx - 9 * sc, by - f); ctx.quadraticCurveTo(bx - 4 * sc, by - 3 * sc, bx, by); ctx.quadraticCurveTo(bx + 4 * sc, by - 3 * sc, bx + 9 * sc, by - f);
  }
  ctx.stroke();
}
function masonry(x0, y0, x1, y1, col, jc, seed, rowH = 24) {
  ctx.fillStyle = col; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
  ctx.strokeStyle = jc; ctx.lineWidth = 1.4; ctx.beginPath();
  let r = 0;
  for (let y = y1; y > y0 + 2; y -= rowH, r++) {
    const yt = Math.max(y0, y - rowH);
    ctx.moveTo(x0, yt); ctx.lineTo(x1, yt);
    let x = x0 + hash(seed + r * 3.3) * 40;
    while (x < x1 - 8) { ctx.moveTo(x, y); ctx.lineTo(x + (hash(x + r) - .5) * 6, yt); x += 34 + hash(seed + x * .13 + r) * 46; }
  }
  ctx.stroke();
}
function crenel(x0, x1, y, w, h, col) { ctx.fillStyle = col; for (let x = x0; x < x1 - w * .5; x += w * 2) ctx.fillRect(x, y - h, Math.min(w, x1 - x), h); }
function minaret(x, base, h, w, col, balc) {
  ctx.fillStyle = col;
  ctx.fillRect(x - w * .65, base - h * .18, w * 1.3, h * .18);
  ctx.fillRect(x - w / 2, base - h, w, h);
  for (const f of balc) { const y = base - h * f; ctx.fillRect(x - w * .95, y - 3, w * 1.9, 5); ctx.fillRect(x - w * .75, y + 2, w * 1.5, 3); }
  const top = base - h; P([x - w * .62, top + 1, x + w * .62, top + 1, x, top - w * 3.4]); ctx.fill();
  line(x, top - w * 3.4, x, top - w * 4.3, 1.4, col);
}
function crescentMark(x, y, r, col) {
  ctx.beginPath(); ctx.arc(x, y, r, .6, TAU - .6); ctx.arc(x + r * .45, y, r * .8, -.9, .9, true); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
}
function galley(x, y, sc, ang, hull, sail, t, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(sc * (o.flip ? -1 : 1), sc);
  if (o.oars !== false) {
    ctx.strokeStyle = hull; ctx.lineWidth = 2; ctx.beginPath(); const sw = Math.sin(t * 4) * .45;
    for (let k = 0; k < 9; k++) { const ox = -48 + k * 12; ctx.moveTo(ox, -2); ctx.lineTo(ox + Math.sin(sw) * 16, 22); }
    ctx.stroke();
  }
  ctx.fillStyle = hull; ctx.beginPath(); ctx.moveTo(-88, -22); ctx.quadraticCurveTo(-78, 6, -44, 8); ctx.lineTo(52, 8);
  ctx.quadraticCurveTo(80, 4, 94, -14); ctx.lineTo(84, -9); ctx.lineTo(-76, -9); ctx.closePath(); ctx.fill();
  line(0, -8, 0, -108, 3, hull);
  if (o.lateen) { fillP([-46, -34, 52, -122, 8, -18], sail); line(-50, -30, 56, -126, 2.5, hull); }
  else {
    ctx.fillStyle = sail; ctx.beginPath(); ctx.moveTo(-34, -100); ctx.lineTo(34, -100); ctx.quadraticCurveTo(40, -66, 32, -36); ctx.lineTo(-32, -36); ctx.quadraticCurveTo(-26, -66, -34, -100); ctx.fill();
    if (o.stripe) { ctx.fillStyle = o.stripe; ctx.fillRect(-35, -74, 70, 9); }
    line(-40, -100, 40, -100, 2.5, hull);
  }
  if (o.lantern) glow(88, -24, 30, [255, 190, 110], .7, true);
  ctx.restore();
}
function miniShip(x, y, sc, hull, sail) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  fillP([-40, -6, 40, -6, 30, 4, -32, 4], hull);
  line(0, -6, 0, -50, 2, hull);
  fillP([-18, -46, 18, -46, 16, -16, -16, -16], sail);
  ctx.restore();
}
function water(x0, x1, wy, c1, c2, t, o = {}) {
  const g = ctx.createLinearGradient(0, wy, 0, wy + 260); g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(x0, wy, x1 - x0, 1400 - wy);
  ctx.strokeStyle = o.ripple || 'rgba(255,255,255,.14)'; ctx.lineWidth = 1.6; ctx.beginPath();
  for (let k = 0; k < 46; k++) {
    const d = Math.pow(hash(k * 1.7), 1.5), y = wy + 5 + d * 230, x = x0 + hash(k * 3.1) * (x1 - x0) + Math.sin(t * .9 + k) * 16, l = 8 + d * 44;
    ctx.moveTo(x, y); ctx.lineTo(x + l, y);
  }
  ctx.stroke();
  if (o.glitterX != null) {
    for (let k = 0; k < 26; k++) {
      const y = wy + 6 + k * 8.5, a = .5 + .5 * Math.sin(t * 5 + k * 1.3), w = (10 + k * 2.2) * (.6 + .4 * a);
      ctx.fillStyle = rgb(o.glit, .55 * a * (1 - k / 30)); ctx.fillRect(o.glitterX - w / 2 + Math.sin(t * 2 + k) * 6, y, w, 2.2);
    }
  }
  if (o.banks !== false) { bank(x0, wy, -1); bank(x1, wy, 1); }
}
function bank(x, wy, dir) {
  const g = ctx.createLinearGradient(0, wy, 0, wy + 260); g.addColorStop(0, rgb(CUR.ground)); g.addColorStop(1, rgb(mixc(CUR.ground, [0, 0, 0], .45)));
  fillP([x + dir * 30, wy - 3, x - dir * 6, wy - 3, x - dir * 120, 1400, x + dir * 260, 1400], g);
}
function reflect(x, col, w, t, y0, n) {
  for (let k = 0; k < n; k++) {
    const y = y0 + 6 + k * 9, a = (.5 + .5 * Math.sin(t * 4 + k * 1.7 + x)) * (1 - k / n);
    ctx.fillStyle = rgb(col, .5 * a); const ww = w * (.6 + .8 * hash(k + x));
    ctx.fillRect(x - ww / 2 + Math.sin(t * 1.5 + k) * 4, y, ww, 2);
  }
}
function flame(x, y, s, t) {
  const layers = [[255, 110, 40, .95], [255, 176, 64, .85], [255, 240, 176, .8]];
  layers.forEach((c, i) => {
    const hh = s * (1 - i * .28) * (.9 + .2 * Math.sin(t * 17 + i * 2)), ww = s * .42 * (1 - i * .3);
    ctx.beginPath(); ctx.moveTo(x - ww, y); ctx.quadraticCurveTo(x - ww * .9, y - hh * .5, x + Math.sin(t * 9 + i) * ww * .5, y - hh);
    ctx.quadraticCurveTo(x + ww * .9, y - hh * .5, x + ww, y); ctx.closePath(); ctx.fillStyle = rgb(c, c[3]); ctx.fill();
  });
}

/* ------------------------------------------------------- the flag (drawn once) */
// Proportions from the Turkish Flag Law: length 1.5 G, crescent circles 0.5 G and 0.4 G wide,
// centres 1/16 G apart, star circle 0.25 G wide and 1/3 G from the inner circle.
const FLAG = document.createElement('canvas'); FLAG.width = 600; FLAG.height = 400;
(() => {
  const f = FLAG.getContext('2d'), G = 400;
  f.fillStyle = '#E30A17'; f.fillRect(0, 0, 600, 400);
  f.fillStyle = '#fff'; f.beginPath(); f.arc(.5 * G, .5 * G, .25 * G, 0, TAU); f.fill();
  f.fillStyle = '#E30A17'; f.beginPath(); f.arc(.5625 * G, .5 * G, .2 * G, 0, TAU); f.fill();
  const cx = (.5625 - .2 + 1 / 3 + .125) * G, cy = .5 * G, R = .125 * G, r = R * .381966;
  f.fillStyle = '#fff'; f.beginPath();
  for (let k = 0; k < 10; k++) { const a = Math.PI + k * Math.PI / 5, q = k % 2 ? r : R; const px = cx + Math.cos(a) * q, py = cy + Math.sin(a) * q; k ? f.lineTo(px, py) : f.moveTo(px, py); }
  f.closePath(); f.fill();
})();
function wavingFlag(x, y, G, t, amp) {
  const L = G * 1.5, n = 40, sw = L / n;
  for (let i = 0; i < n; i++) {

  const now = AC.currentTime;
  OUT.gain.cancelScheduledValues(now);
  if (soundOn) { OUT.gain.setValueAtTime(0, now); OUT.gain.setTargetAtTime(.9, now, .05); if (!paused && !document.hidden) AC.resume(); }
  else { OUT.gain.setTargetAtTime(0, now, .04); setTimeout(() => { if (!soundOn) AC.suspend(); }, 250); }
}
// Renders any stretch of the score offline into an AudioBuffer (handy for checking the mix).
async function renderMusic(from = 0, to = TOTAL, rate = 44100) {
  const saved = [AC, OUT, VERB, NOISE, epoch, schedAbs];
  const off = new OfflineAudioContext(2, Math.ceil((to - from + 2) * rate), rate);
  buildGraph(off); OUT.gain.value = .9;
  const k0 = secAt(from); if (MUS[k0].sus && from - secStart(k0) > .01) MUS[k0].sus(0, secEnd(k0) - from, .3);
  for (let i = Math.ceil(from / STEP - 1e-6); i * STEP < to; i++) stepAt(i * STEP, i * STEP - from, i);

}
function drawSoundHint() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const age = (performance.now() - soundT) / 1000, x = W - Lay.gut, y = H - Lay.sB - 42;
  const a = soundOn ? lerp(.9, .38, smooth(1.5, 3, age)) : .62 + .25 * Math.sin(performance.now() / 450);
  ctx.globalAlpha = a; ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 8;
  ctx.fillStyle = '#f6eedc'; ctx.fillRect(x - 21, y - 4, 5, 8); fillP([x - 16, y - 4, x - 9, y - 10, x - 9, y + 10, x - 16, y + 4], '#f6eedc');
  ctx.strokeStyle = '#f6eedc'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  if (soundOn) { for (const r of [5, 9]) { ctx.beginPath(); ctx.arc(x - 8, y, r, -.8, .8); ctx.stroke(); } }
  else {
    ctx.beginPath(); ctx.moveTo(x - 5, y - 4); ctx.lineTo(x + 2, y + 4); ctx.moveTo(x + 2, y - 4); ctx.lineTo(x - 5, y + 4); ctx.stroke();
    ctx.font = `600 ${Math.max(10.5, Lay.eye)}px ${SANS}`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    if ('letterSpacing' in ctx) ctx.letterSpacing = `${Math.max(10.5, Lay.eye) * .16}px`;
    ctx.fillText(matchMedia('(pointer: coarse)').matches ? 'TAP FOR SOUND' : 'CLICK FOR SOUND', x - 30, y + 1);
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
  ctx.globalAlpha = 1; ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
}

/* ================================================================ CLOCK */
// M counts seconds without wrapping. While sound plays, it follows the audio clock so picture and music never drift.
let T = 0, M = 0, last = performance.now(), paused = false, wasLive = false, anchorM = 0, anchorA = 0;
const audioLive = () => soundOn && AC && AC.state === 'running';
function reanchor() { anchorM = M; anchorA = AC ? AC.currentTime : 0; }
function resetMusic() { if (AC && epoch) newEpoch(); schedAbs = null; }
function setTime(v) { M = Math.floor(M / TOTAL) * TOTAL + clamp(v, 0, TOTAL - .001); T = M - Math.floor(M / TOTAL) * TOTAL; reanchor(); resetMusic(); }
function setPaused(p) { paused = p; if (AC && soundOn) { if (p) AC.suspend(); else AC.resume(); } }
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, .1); last = now;
  const liveNow = audioLive();
  if (liveNow !== wasLive) { reanchor(); resetMusic(); wasLive = liveNow; }
  if (!paused && !document.hidden) M = liveNow ? anchorM + (AC.currentTime - anchorA) : M + dt;
  T = M - Math.floor(M / TOTAL) * TOTAL;
  if (liveNow && !paused) schedule(M, anchorM, anchorA);
  render(T); drawSoundHint();
  requestAnimationFrame(frame);
}
addEventListener('resize', layout);
addEventListener('pointerdown', toggleSound);
document.addEventListener('visibilitychange', () => { if (!AC || !soundOn) return; if (document.hidden) AC.suspend(); else if (!paused) AC.resume(); });
addEventListener('keydown', e => {
  if (e.code === 'Space') { setPaused(!paused); e.preventDefault(); }
  else if (e.code === 'KeyM') toggleSound();
  else if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') {
    const st = stateAt(T), k = clamp((st.holding ? st.a : st.b) + (e.code === 'ArrowRight' ? 1 : -1), 0, SC.length - 1);
    setTime(SC[k].hs + (k === 0 ? .8 : .05));
  }
});
window.turkeyAnimation = {
  seek: v => { setTime(v); render(T); drawSoundHint(); }, pause: () => setPaused(true), play: () => setPaused(false),
  chapters: SC.map(c => ({ title: c.title, start: c.hs, end: c.he })), renderMusic
};
layout();
requestAnimationFrame(frame);
})();
